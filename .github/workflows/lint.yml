name: Lint
on:
  pull_request:
    branches:
      - ros2

jobs:
  ament_lint_general:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-ros-jazzy-ros-base-latest
    strategy:
      fail-fast: false
      matrix:
          linter: [copyright, flake8, lint_cmake, mypy, pep257, xmllint]
    steps:
    - uses: actions/checkout@v6.0.0

    - name: Install typeshed for mypy
      if: matrix.linter == 'mypy'
      run: sudo apt update && sudo apt install -y python3-typeshed

    - uses: ros-tooling/action-ros-lint@v0.1
      with:
        linter: ${{ matrix.linter }}
        distribution: jazzy
        package-name: "*"
        arguments: ${{ matrix.linter == 'mypy' && '--config mypy.ini' || '' }}

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.0

      - name: Set up Python environment
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: >-
            ament_copyright,
            ament_flake8,
            ament_lint_cmake,
            ament_mypy,
            ament_pep257,
            ament_xmllint
